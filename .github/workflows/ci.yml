name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-CU1-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: LocalOnly_ApprovalFlow_2026!
        ports:
          - 14333:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalOnly_ApprovalFlow_2026!' -C -Q 'SELECT 1'"
          --health-interval=5s --health-timeout=5s --health-retries=20
      servicebus-sql:
        image: mcr.microsoft.com/azure-sql-edge:2.0.0
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: LocalOnly_ServiceBus_2026!
      servicebus:
        image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.0
        env:
          ACCEPT_EULA: Y
          SQL_SERVER: servicebus-sql
          MSSQL_SA_PASSWORD: LocalOnly_ServiceBus_2026!
          EMULATOR_HTTP_PORT: "5300"
          SQL_WAIT_INTERVAL: "20"
        ports:
          - 5672:5672
          - 5300:5300
        volumes:
          - ${{ github.workspace }}/infrastructure/servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/ApprovalFlow.Web/package-lock.json
      - run: dotnet restore ApprovalFlow.slnx
      - run: dotnet build ApprovalFlow.slnx --no-restore
      - run: dotnet test ApprovalFlow.slnx --no-build
        env:
          APPROVALFLOW_TESTCONTAINERS: "true"
      - run: dotnet format ApprovalFlow.slnx --verify-no-changes --no-restore
      - working-directory: src/ApprovalFlow.Web
        run: npm ci
      - working-directory: src/ApprovalFlow.Web
        run: npm run lint
      - working-directory: src/ApprovalFlow.Web
        run: npm test
      - working-directory: src/ApprovalFlow.Web
        run: npm run build
      - working-directory: src/ApprovalFlow.Web
        run: npm run e2e
      - run: docker compose config --quiet
      - run: docker compose build
