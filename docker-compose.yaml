services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-CU1-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "LocalOnly_ApprovalFlow_2026!"
    ports:
      - "14333:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LocalOnly_ApprovalFlow_2026!' -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - approvalflow-sql:/var/opt/mssql

  servicebus-sql:
    image: mcr.microsoft.com/azure-sql-edge:2.0.0
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "LocalOnly_ServiceBus_2026!"
    volumes:
      - approvalflow-servicebus-sql:/var/opt/mssql

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.0
    environment:
      ACCEPT_EULA: "Y"
      SQL_SERVER: servicebus-sql
      MSSQL_SA_PASSWORD: "LocalOnly_ServiceBus_2026!"
      EMULATOR_HTTP_PORT: "5300"
      SQL_WAIT_INTERVAL: "20"
    volumes:
      - ./infrastructure/servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports:
      - "5672:5672"
      - "5300:5300"
    depends_on:
      - servicebus-sql

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard@sha256:f287c6954596315ada6fb45af6ed2e451c45658aeb68d98dc1cfed5b5b253895
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "18888:18888"
      - "4317:18889"

  api:
    build:
      context: .
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5080
      ConnectionStrings__ApprovalFlow: Server=sqlserver;Database=ApprovalFlow;User Id=sa;Password=LocalOnly_ApprovalFlow_2026!;TrustServerCertificate=True;Encrypt=True
      ConnectionStrings__ServiceBus: Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
    ports:
      - "5080:5080"
    depends_on:
      sqlserver:
        condition: service_healthy
      servicebus:
        condition: service_started
      aspire-dashboard:
        condition: service_started

  worker:
    build:
      context: .
      target: worker
    environment:
      ConnectionStrings__ApprovalFlow: Server=sqlserver;Database=ApprovalFlow;User Id=sa;Password=LocalOnly_ApprovalFlow_2026!;TrustServerCertificate=True;Encrypt=True
      ConnectionStrings__ServiceBus: Endpoint=sb://servicebus;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
    depends_on:
      sqlserver:
        condition: service_healthy
      servicebus:
        condition: service_started
      aspire-dashboard:
        condition: service_started

  web:
    build:
      context: .
      target: web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  approvalflow-sql:
  approvalflow-servicebus-sql:
